# Publica o site no GitHub Pages a cada push na main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eleicao-eliminatoria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: eleicao-eliminatoria/package-lock.json
      - run: npm ci
      - run: npm run build
      # O site fica em /eleicao-eliminatoria/: o build vai para uma pasta com esse nome.
      - run: mkdir -p _site && cp -r dist _site/eleicao-eliminatoria
      - uses: actions/upload-pages-artifact@v3
        with:
          path: eleicao-eliminatoria/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
